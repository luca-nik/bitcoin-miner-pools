<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .p{shape-rendering:crispEdges}
  </style>
  <!-- Background -->
  <rect class="p" width="32" height="32" fill="#0a0a0a"/>
  <!-- Scanline overlay -->
  <g opacity="0.08">
    <rect class="p" y="0" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="2" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="4" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="6" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="8" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="10" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="12" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="14" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="16" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="18" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="20" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="22" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="24" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="26" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="28" width="32" height="1" fill="#33ff00"/>
    <rect class="p" y="30" width="32" height="1" fill="#33ff00"/>
  </g>
  <!-- Pickaxe handle (diagonal, pixel style) -->
  <g fill="#33ff00">
    <rect class="p" x="6" y="4" width="2" height="2"/>
    <rect class="p" x="7" y="4" width="2" height="2"/>
    <rect class="p" x="8" y="6" width="2" height="2"/>
    <rect class="p" x="9" y="8" width="2" height="2"/>
    <rect class="p" x="10" y="10" width="2" height="2"/>
    <rect class="p" x="11" y="12" width="2" height="2"/>
    <rect class="p" x="12" y="14" width="2" height="2"/>
    <rect class="p" x="13" y="16" width="2" height="2"/>
    <rect class="p" x="14" y="18" width="2" height="2"/>
    <rect class="p" x="15" y="20" width="2" height="2"/>
    <rect class="p" x="16" y="22" width="2" height="2"/>
    <rect class="p" x="17" y="24" width="2" height="2"/>
    <rect class="p" x="18" y="26" width="2" height="2"/>
  </g>
  <!-- Pickaxe head -->
  <g fill="#ffb000">
    <rect class="p" x="2" y="2" width="2" height="2"/>
    <rect class="p" x="4" y="2" width="2" height="2"/>
    <rect class="p" x="6" y="2" width="2" height="2"/>
    <rect class="p" x="8" y="2" width="2" height="2"/>
    <rect class="p" x="10" y="2" width="2" height="2"/>
    <rect class="p" x="2" y="4" width="2" height="2"/>
    <rect class="p" x="4" y="4" width="2" height="2"/>
  </g>
  <!-- Scope crosshair (right side) -->
  <g fill="#33ff00" opacity="0.9">
    <rect class="p" x="20" y="10" width="2" height="2"/>
    <rect class="p" x="22" y="10" width="2" height="2"/>
    <rect class="p" x="24" y="10" width="2" height="2"/>
    <rect class="p" x="26" y="10" width="2" height="2"/>
    <rect class="p" x="28" y="10" width="2" height="2"/>
    <rect class="p" x="24" y="6" width="2" height="2"/>
    <rect class="p" x="24" y="8" width="2" height="2"/>
    <rect class="p" x="24" y="12" width="2" height="2"/>
    <rect class="p" x="24" y="14" width="2" height="2"/>
    <rect class="p" x="24" y="16" width="2" height="2"/>
    <rect class="p" x="20" y="16" width="2" height="2"/>
    <rect class="p" x="22" y="16" width="2" height="2"/>
    <rect class="p" x="24" y="16" width="2" height="2"/>
    <rect class="p" x="26" y="16" width="2" height="2"/>
    <rect class="p" x="28" y="16" width="2" height="2"/>
  </g>
  <!-- Scope center dot -->
  <rect class="p" x="24" y="10" width="2" height="2" fill="#ffffff"/>
  <!-- Cursor blink -->
  <rect class="p" x="20" y="22" width="4" height="2" fill="#33ff00"/>
  <rect class="p" x="20" y="25" width="8" height="2" fill="#33ff00" opacity="0.4"/>
  <rect class="p" x="20" y="28" width="6" height="2" fill="#33ff00" opacity="0.25"/>
</svg>
